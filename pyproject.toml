[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-locator-agent"
version = "6.0.0"
description = "AI Locator Agent - AI驱动的智能元素定位与多步任务规划"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local-vision = [
    "paddleocr>=2.7.0,<3.0.0",
    "paddlepaddle>=2.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
ai-locator-agent = "ai_locator_agent.server:main"

[tool.setuptools.packages.find]
include = ["ai_locator_agent*"]
